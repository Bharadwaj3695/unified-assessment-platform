# UAP Frontend Modular Docker Compose Configuration
# Usage from repo root: docker compose -f docker-compose/docker-compose.frontend.yml up -d
# Usage from docker-compose/: docker compose -f docker-compose.frontend.yml up -d

name: unifiedassessmentplatformoriginal

services:
  uap-frontend:
    image: uap-frontend:latest
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
    container_name: uap-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:5000/api
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health && curl -sf -o /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - uap-public-net

networks:
  uap-public-net:
    name: uap-public-net
    driver: bridge
