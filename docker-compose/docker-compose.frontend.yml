# UAP Frontend Modular Docker Compose Configuration
# Usage from repo root: docker compose -f docker-compose/docker-compose.frontend.yml up -d
# Usage from docker-compose/: docker compose -f docker-compose.frontend.yml up -d

name: unifiedassessmentplatformoriginal

services:
  uap-frontend:
    image: uap-frontend:latest
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
    container_name: uap-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - uap-public-net

networks:
  uap-public-net:
    name: uap-public-net
    driver: bridge
